<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Marketing Compass</title>
<meta name="description" content="Marketing analytics for private hospitals: capacity, no-shows, conversion, target segments and campaign return.">
<meta name="theme-color" content="#0A6B63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marketing Compass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky header + scrollable tab strip; each tab is a stack of panels, summary first, detail below. Logical properties so RTL and LTR share one sheet. */
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#14201E; --muted:#5B6967; --line:#D9E2E0;
  --accent:#0A6B63; --accent-soft:#DDEFEC; --accent-ink:#FFFFFF;
  --good:#1D7A3B; --warn:#A76300; --bad:#B42318;
  --good-soft:#E3F3E8; --warn-soft:#FFF1D9; --bad-soft:#FCE6E3;
  --display:"Sora", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
  --body:"IBM Plex Sans", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
:root[lang="ar"]{
  --display:"IBM Plex Sans Arabic", "Sora", ui-sans-serif, system-ui, Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", "IBM Plex Sans", ui-sans-serif, system-ui, Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1615; --surface:#172120; --ink:#E6EEEC; --muted:#9AABA8; --line:#2A3836;
    --accent:#4FC2B6; --accent-soft:#183A36; --accent-ink:#06201D;
    --good:#5BC583; --warn:#F0B04F; --bad:#F27A6B;
    --good-soft:#173322; --warn-soft:#3A2C12; --bad-soft:#3D1D19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1615; --surface:#172120; --ink:#E6EEEC; --muted:#9AABA8; --line:#2A3836;
  --accent:#4FC2B6; --accent-soft:#183A36; --accent-ink:#06201D;
  --good:#5BC583; --warn:#F0B04F; --bad:#F27A6B;
  --good-soft:#173322; --warn-soft:#3A2C12; --bad-soft:#3D1D19;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:18px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-inline-end:auto;min-width:0}
.brand small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
.pill.live{background:var(--good-soft);color:var(--good)}
.pill.critical{background:var(--bad-soft);color:var(--bad)}
.pill.warning{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.period{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
textarea{width:100%;resize:vertical;min-height:80px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .count{font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px;margin-inline-start:4px;font-weight:600}

main{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
section.tab{display:none;flex-direction:column;gap:16px}
section.tab.active{display:flex}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head p,.hint{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--bad)} .flat{color:var(--muted)}
.chart{position:relative;height:260px}

.issues{display:flex;flex-direction:column;gap:10px}
.issue{border:1px solid var(--line);border-inline-start:4px solid var(--muted);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.issue.critical{border-inline-start-color:var(--bad)} .issue.warning{border-inline-start-color:var(--warn)} .issue.info{border-inline-start-color:var(--accent)}
.issue .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.issue p{margin:0;font-size:14px}
.issue ul{margin:0;padding-inline-start:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.impact{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;min-height:28px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px}
.heat td.h{text-align:end;font-variant-numeric:tabular-nums}
code{direction:ltr;unicode-bidi:embed}

.opps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.opp{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.opp .rank{font-family:var(--display);font-weight:700;color:var(--accent);font-size:13px}
.opp .who{font-weight:600}
.opp .why{font-size:13px;color:var(--muted)}
.scorebar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--accent)}

form.inline{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
form.inline label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
form.inline label input,form.inline label select,.field input,.field select{color:var(--ink);font-size:14px}
details summary{cursor:pointer;font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.drop{border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer}
.drop.over{background:var(--surface);border-style:solid}
.drop strong{font-family:var(--display);font-size:16px}
.drop span{font-size:13px;color:var(--muted)}
.onboard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:center}
.onboard ol{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.answer{white-space:pre-wrap;font-size:14.5px;line-height:1.7;max-width:75ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface);cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.status-todo{color:var(--muted)} .status-doing{color:var(--warn)} .status-done{color:var(--good)}
@media (max-width:480px){ .kpi .value{font-size:19px} .chart{height:230px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <h1 id="hospName"></h1>
      <small><span id="dataBadge" class="pill demo"></span> <span id="rangeLabel"></span></small>
    </div>
    <div class="lang" role="group" aria-label="Language / اللغة">
      <button type="button" data-lang="ar" lang="ar">عربي</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button class="btn primary" id="hdrUpload" type="button"></button>
    <input type="file" id="quickFile" accept=".xlsx,.xls,.csv" hidden>
    <label class="period" for="periodSel"><span data-i18n="compareLast"></span>
      <select id="periodSel">
        <option value="3" data-i18n="m3"></option>
        <option value="6" data-i18n="m6"></option>
      </select>
    </label>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true" data-i18n="tabOverview"></button>
    <button role="tab" data-tab="problems" aria-selected="false"><span data-i18n="tabProblems"></span><span class="count" id="issueCount"></span></button>
    <button role="tab" data-tab="audience" aria-selected="false" data-i18n="tabAudience"></button>
    <button role="tab" data-tab="campaigns" aria-selected="false" data-i18n="tabCampaigns"></button>
    <button role="tab" data-tab="plan" aria-selected="false" data-i18n="tabPlan"></button>
    <button role="tab" data-tab="advisor" aria-selected="false" data-i18n="tabAdvisor"></button>
    <button role="tab" data-tab="data" aria-selected="false" data-i18n="tabData"></button>
  </nav>
</header>

<main>
  <!-- OVERVIEW -->
  <section class="tab active" id="tab-overview">
    <div class="onboard" id="onboard">
      <div>
        <h2 data-i18n="obTitle"></h2>
        <p class="hint" data-i18n="obSub"></p>
        <ol>
          <li><button class="btn small" type="button" id="obTemplate" data-i18n="obStep1"></button></li>
          <li data-i18n="obStep2"></li>
          <li data-i18n="obStep3"></li>
        </ol>
      </div>
      <div class="drop" id="dropZone" role="button" tabindex="0">
        <strong data-i18n="dropTitle"></strong>
        <span data-i18n="dropSub"></span>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid g2">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="chTrendT"></h2><p data-i18n="chTrendS"></p></div>
        <div class="chart"><canvas id="chTrend"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="chUtilT"></h2><p id="utilHint"></p></div>
        <div class="chart"><canvas id="chUtil"></canvas></div>
      </div>
    </div>
    <div class="grid g2">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="chSrcT"></h2><p data-i18n="chSrcS"></p></div>
        <div class="chart"><canvas id="chSources"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="topIssuesT"></h2><button class="btn small" data-goto="problems" data-i18n="seeAll"></button></div>
        <div class="issues" id="topIssues"></div>
      </div>
    </div>
  </section>

  <!-- PROBLEMS -->
  <section class="tab" id="tab-problems">
    <div class="panel">
      <div class="panel-head">
        <div><h2 data-i18n="probT"></h2><p data-i18n="probS"></p></div>
        <select id="sevFilter">
          <option value="all" data-i18n="sevAll"></option><option value="critical" data-i18n="sevCrit"></option><option value="warning" data-i18n="sevWarn"></option><option value="info" data-i18n="sevInfo"></option>
        </select>
      </div>
      <p class="note" data-i18n-html="probNote"></p>
      <div class="issues" id="allIssues"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="scoreT"></h2><p data-i18n="selPeriod"></p></div>
      <div class="tablewrap"><table id="deptTable"></table></div>
    </div>
  </section>

  <!-- AUDIENCE -->
  <section class="tab" id="tab-audience">
    <div class="panel">
      <div class="panel-head"><div><h2 data-i18n="oppT"></h2><p data-i18n="oppS"></p></div></div>
      <div class="opps" id="opps"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="segT"></h2>
        <div class="row">
          <label class="field" for="segDim"><span data-i18n="groupBy"></span>
            <select id="segDim"><option value="age_group" data-i18n="dimAge"></option><option value="area" data-i18n="dimArea"></option><option value="payer" data-i18n="dimPayer"></option><option value="department" data-i18n="dimDept"></option></select>
          </label>
          <label class="field" for="segDept"><span data-i18n="dimDept"></span>
            <select id="segDept"></select>
          </label>
        </div>
      </div>
      <div class="grid g2">
        <div class="chart"><canvas id="chSeg"></canvas></div>
        <div class="tablewrap"><table id="segTable"></table></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="heatT"></h2><p data-i18n="heatS"></p></div>
      <div class="tablewrap"><table class="heat" id="heat"></table></div>
    </div>
  </section>

  <!-- CAMPAIGNS -->
  <section class="tab" id="tab-campaigns">
    <div class="kpis" id="campKpis"></div>
    <div class="grid g2">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="chChT"></h2><p data-i18n="chChS"></p></div>
        <div class="chart"><canvas id="chChannel"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="chCpbT"></h2><p id="cpbHint"></p></div>
        <div class="chart"><canvas id="chCpb"></canvas></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="campAllT"></h2><p data-i18n="campAllS"></p></div>
      <div class="tablewrap"><table id="campTable"></table></div>
      <details>
        <summary data-i18n="addCamp"></summary>
        <form class="inline" id="campForm" style="margin-top:12px">
          <label for="cf-name"><span data-i18n="fName"></span><input type="text" id="cf-name" required></label>
          <label for="cf-channel"><span data-i18n="fChannel"></span><input type="text" id="cf-channel" list="channelList" required></label>
          <label for="cf-dept"><span data-i18n="dimDept"></span><select id="cf-dept"></select></label>
          <label for="cf-month"><span data-i18n="fMonth"></span><input type="text" id="cf-month" placeholder="2026-11" pattern="\d{4}-\d{2}" dir="ltr" required></label>
          <label for="cf-spend"><span data-i18n="fSpend"></span><input type="number" id="cf-spend" min="0" required></label>
          <label for="cf-leads"><span data-i18n="fLeads"></span><input type="number" id="cf-leads" min="0" required></label>
          <label for="cf-bookings"><span data-i18n="fBookings"></span><input type="number" id="cf-bookings" min="0" required></label>
          <label for="cf-revenue"><span data-i18n="fRevenue"></span><input type="number" id="cf-revenue" min="0" required></label>
          <button class="btn primary" type="submit" data-i18n="addCampBtn"></button>
        </form>
        <datalist id="channelList"></datalist>
      </details>
    </div>
  </section>

  <!-- PLAN -->
  <section class="tab" id="tab-plan">
    <div class="panel">
      <div class="panel-head"><div><h2 data-i18n="planT"></h2><p data-i18n="planS"></p></div><span id="planStats" class="hint"></span></div>
      <div class="tablewrap"><table id="planTable"></table></div>
      <form class="inline" id="planForm">
        <label for="pf-title" style="grid-column:span 2"><span data-i18n="fAction"></span><input type="text" id="pf-title" required data-i18n-ph="fActionPh"></label>
        <label for="pf-dept"><span data-i18n="dimDept"></span><select id="pf-dept"></select></label>
        <label for="pf-owner"><span data-i18n="fOwner"></span><input type="text" id="pf-owner" data-i18n-ph="fOwnerPh"></label>
        <label for="pf-due"><span data-i18n="fDue"></span><input type="date" id="pf-due"></label>
        <button class="btn primary" type="submit" data-i18n="addActBtn"></button>
      </form>
    </div>
  </section>

  <!-- ADVISOR -->
  <section class="tab" id="tab-advisor">
    <div class="panel">
      <div class="panel-head"><div><h2 data-i18n="advT"></h2><p data-i18n="advS"></p></div></div>
      <div id="advisorOff" class="note" hidden data-i18n="advOff"></div>
      <div id="advisorOn">
        <div class="chips" id="presets"></div>
        <label for="askBox" class="hint" style="display:block;margin:10px 0 4px" data-i18n="yourQ"></label>
        <textarea id="askBox" dir="auto" data-i18n-ph="askPh"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="askBtn" data-i18n="ask"></button><button class="btn" id="stopBtn" hidden data-i18n="stop"></button></div>
      </div>
      <div class="answer" id="answer" dir="auto"></div>
    </div>
  </section>

  <!-- DATA -->
  <section class="tab" id="tab-data">
    <div class="panel">
      <div class="panel-head"><div><h2 data-i18n="dataT"></h2><p data-i18n="dataS"></p></div></div>
      <div class="row">
        <button class="btn primary" id="dlTemplate" data-i18n="dlFull"></button>
        <button class="btn" id="dlBlank" data-i18n="dlBlank"></button>
      </div>
      <p class="hint" data-i18n="dlNote"></p>
      <div class="row">
        <label class="field" for="importTarget"><span data-i18n="importInto"></span>
          <select id="importTarget">
            <option value="auto" data-i18n="importAuto"></option>
            <option value="depts">Departments_Monthly</option>
            <option value="sources">Sources_Monthly</option>
            <option value="segments">Segments</option>
            <option value="campaigns">Campaigns</option>
          </select>
        </label>
        <label class="field" for="fileIn"><span data-i18n="fileLbl"></span>
          <input type="file" id="fileIn" accept=".xlsx,.xls,.csv">
        </label>
      </div>
      <div id="importLog" class="note" hidden style="white-space:pre-wrap"></div>
      <div class="tablewrap"><table id="schemaTable"></table></div>
      <div class="row"><button class="btn danger" id="resetDemo" data-i18n="resetDemo"></button></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="setT"></h2><p data-i18n="setS"></p></div>
      <form class="inline" id="setForm">

        evidence:t("i.conv.e", { a:fmt(d.inquiries / n), b:fmt(d.new_patients / n), l:st.conv }),
        impact:(st.conv / 100 * d.inquiries - d.new_patients) / n * rpv, impactNote:t("i.conv.n", { l:st.conv }) });
  }
  const payers = {}; S.data.segments.forEach(r => payers[r.payer] = (payers[r.payer] || 0) + (+r.revenue || 0));
  const pt = sum(Object.values(payers)), topP = Object.entries(payers).sort((a, b) => b[1] - a[1])[0];

  const curSet = new Set(cur), src = {}; S.data.sources.filter(r => curSet.has(r.month)).forEach(r => src[r.source] = (src[r.source] || 0) + (+r.new_patients || 0));
  const stt = sum(Object.values(src)), topS = Object.entries(src).sort((a, b) => b[1] - a[1])[0];

    I.push({ key:"source", sev:"warning", dept:"All", title:t("i.source.t", { x:tv(topS[0]), p:pct(topS[1] / stt) }), evidence:t("i.source.e", { l:st.concentration }), impact:null });
  S.data.campaigns.forEach(c => {

      I.push({ key:"camp", sev:"warning", dept:c.department, title:t("i.camp.t", { x:tv(c.name), r:ro.toFixed(2) }),
        evidence:t("i.camp.e", { s:money(c.spend), v:money(c.revenue), b:fmt(c.bookings), c:tv(c.channel), m:c.month }),
        impact:c.spend - c.revenue, impactNote:t("i.camp.n"), cid:c.id || c.name });

  return I.sort((a, b) => SEVRANK[a.sev] - SEVRANK[b.sev] || (b.impact || 0) - (a.impact || 0));
}

function mkChart(id, cfg){

  if (prev == null || cur == null || !isFinite(prev) || !isFinite(cur) || prev === 0) return `<span class="delta flat">${t("dNoPrev")}</span>`;
  const d = isPct ? (cur - prev) * 100 : (cur / prev - 1) * 100;
  if (Math.abs(d) < .5) return `<span class="delta flat">${t("dFlat")}</span>`;
  const up = d > 0, cls = up === goodUp ? (up ? "up-good" : "down-good") : (up ? "up-bad" : "down-bad");
  return `<span class="delta ${cls}">${up ? "▲" : "▼"} ${Math.abs(d).toFixed(1)}${isPct ? t("pts") : "%"} ${t("dVs")}</span>`;
}

function opportunities(){

  S.data.segments.forEach(r => { const k = r.department + "|" + r.age_group + "|" + r.area;
    const a = g[k] || (g[k] = { department:r.department, age_group:r.age_group, area:r.area, patients:0, prev:0, revenue:0, payers:{} });
    a.patients += +r.patients || 0; a.prev += +r.prev_patients || 0; a.revenue += +r.revenue || 0; a.payers[r.payer] = (a.payers[r.payer] || 0) + (+r.patients || 0); });
  const rows = Object.values(g).filter(a => a.patients >= 30);
  if (!rows.length) return [];
  rows.forEach(a => { a.vpp = a.revenue / a.patients; a.growth = a.prev ? a.patients / a.prev - 1 : 0;
    const u = C[a.department] ? C[a.department].util : null; a.util = u; a.spare = u == null ? .3 : Math.max(0, st.utilHigh / 100 - u) / (st.utilHigh / 100); });
  const norm = k => { const v = rows.map(r => r[k]), lo = Math.min(...v), hi = Math.max(...v); rows.forEach(r => r[k + "N"] = hi > lo ? (r[k] - lo) / (hi - lo) : .5); };
  norm("vpp"); norm("growth"); norm("spare");
  rows.forEach(r => r.score = .4 * r.vppN + .35 * r.growthN + .25 * r.spareN);
  return rows.sort((a, b) => b.score - a.score);
}

      <td><button class="btn small danger" data-delact="${a.id}">${t("del")}</button></td></tr>`).join("")
      : `<tr><td colspan="6" class="empty">${t("noActions")}</td></tr>`) + "</tbody>";
  $("#pf-dept").innerHTML = `<option value="All">${t("all")}</option>` + deptNames().map(d => `<option value="${esc(d)}">${esc(tv(d))}</option>`).join("");
}

/* ================= advisor ================= */
let sampleFn = null, abortCtl = null;
function contextSummary(){
  const { cur, prev, n } = periods(), C = aggDepts(cur), T = totalOf(C), P = totalOf(aggDepts(prev));
  const dep = Object.values(C).map(d => ({ dept:d.department, visits_per_month:Math.round(d.attended / n), new_per_month:Math.round(d.new_patients / n), revenue_per_month:Math.round(d.revenue / n),
    capacity_used:+(d.util * 100).toFixed(1), no_show:+(d.noshow * 100).toFixed(1), inquiry_conversion:+(d.conv * 100).toFixed(1), revenue_per_visit:Math.round(d.rpv) }));
  const src = {}; const cs = new Set(cur); S.data.sources.filter(r => cs.has(r.month)).forEach(r => src[r.source] = (src[r.source] || 0) + (+r.new_patients || 0));
  const ch = {}; S.data.campaigns.forEach(c => { const a = ch[c.channel] || (ch[c.channel] = { spend:0, revenue:0, bookings:0 }); a.spend += +c.spend; a.revenue += +c.revenue; a.bookings += +c.bookings; });
  const saveLang = LANG; LANG = "en"; const issues = diagnose(); LANG = saveLang;
  return {
    hospital:S.settings.hospital, currency:S.settings.currency, data_is_demo:S.demo, period:`${cur[0]} to ${cur[cur.length - 1]} (${n} months), compared with previous ${n} months`,
    totals:{ visits_per_month:Math.round(T.attended / n), visits_change_pct:P.attended ? +((T.attended / P.attended - 1) * 100).toFixed(1) : null, capacity_used:+(T.util * 100).toFixed(1), no_show:+(T.noshow * 100).toFixed(1) },
    departments:dep, new_patient_sources:src, channels:ch,
    campaigns:S.data.campaigns.map(c => ({ name:c.name, channel:c.channel, dept:c.department, month:c.month, spend:c.spend, bookings:c.bookings, revenue:c.revenue })),
    detected_problems:issues.map(i => ({ severity:i.sev, title:i.title, evidence:i.evidence, est_monthly_impact:i.impact ? Math.round(i.impact) : null })),
    top_target_segments:opportunities().slice(0, 10).map(o => ({ dept:o.department, age:o.age_group, area:o.area, patients:o.patients, growth_pct:+(o.growth * 100).toFixed(0), value_per_patient:Math.round(o.vpp), dept_capacity_used:o.util == null ? null : +(o.util * 100).toFixed(0) })),
    open_actions:S.actions.filter(a => a.status !== "done").map(a => a.title)
  };
}
async function ask(q){
  if (!sampleFn || !q.trim()) return;
  const out = $("#answer"); out.textContent = t("thinking");
  $("#askBtn").disabled = true; $("#stopBtn").hidden = false; abortCtl = new AbortController();
  const prompt = `You are a practical marketing advisor for a private hospital in Saudi Arabia. Answer the marketer's question using ONLY the data summary below plus sound hospital-marketing practice.
Rules:
- Reply in the same language as the question (Arabic or English). If Arabic, translate department, channel and segment names into Arabic. Plain text, short headings and numbered points are fine, no markdown tables.
- Be specific: name departments, segments, channels and numbers from the data. Show the arithmetic for any figure you compute, with units (${S.settings.currency}).
- Label anything not directly in the data as an assumption or estimate.
- Prefer actions that fill free capacity before ones that add demand to full departments.
- Respect Saudi rules: patient messages only to people who consented (Personal Data Protection Law), health advertising must follow Ministry of Health rules; mention this only where it matters.
- End with: the decision you recommend, the main risk, and the first action for this week.
${S.demo ? "- Note once that the numbers are demo data." : ""}

DATA SUMMARY (JSON):
${JSON.stringify(contextSummary())}

QUESTION:
${q}`;
  try {
    const res = await sampleFn(prompt, { signal:abortCtl.signal, modelTier:"default", cache:false, onText:({ text }) => { out.textContent = text || t("thinking"); } });
    out.textContent = res.text + (res.truncated ? "\n\n" + t("advCut") : "");
  } catch(e){
    if (e && e.code === "not_granted"){ $("#advisorOn").hidden = true; $("#advisorOff").hidden = false; out.textContent = ""; }
    else if (e && e.code === "rate_limited") out.textContent = t("advRate");
    else if (e && e.name === "AbortError") out.textContent += "\n\n" + t("advStopped");
    else out.textContent = t("advErr", { e:(e && e.message) || "unknown error" });
  } finally { $("#askBtn").disabled = false; $("#stopBtn").hidden = true; abortCtl = null; }
}

/* ================= data import / export ================= */
let downloadsApi = null;
function normMonth(v){
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2,"0")}`;
  if (typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2,"0")}`; }
  const s = String(v ?? "").trim(); let m = s.match(/^(\d{4})[-\/.](\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{4})$/); if (m) return `${m[2]}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}`;
  return s;
}
function normalize(key, rows){
  const sc = SCHEMA[key], errs = [];
  const mapped = rows.map(r => { const o = {}; for (const [k, v] of Object.entries(r)) o[String(k).trim().toLowerCase().replace(/[\s\-]+/g, "_")] = v; return o; });
  if (!mapped.length) return { rows:[], errs:[t("tNoRows", { s:sc.sheet })] };
  const missing = sc.cols.filter(c => !(c in mapped[0]));
  if (missing.length) return { rows:[], errs:[t("tMissing", { s:sc.sheet, c:missing.join(", "), e:sc.cols.join(", ") })] };
  let bad = 0;
  const out = mapped.map(o => { const r = {}; sc.cols.forEach(c => {
      let v = o[c];
      if (sc.nums.includes(c)){ v = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[,\s]|SAR|ر\.?س|ريال/gi, "")); if (!isFinite(v)){ v = 0; bad++; } }
      else if (c === "month") v = normMonth(v); else v = String(v ?? "").trim();
      r[c] = v; });
    if (key === "campaigns") r.id = uid();
    return r; }).filter(r => sc.cols.some(c => !sc.nums.includes(c) && r[c]));
  if (bad) errs.push(t("tBadNum", { s:sc.sheet, n:bad }));
  if (sc.cols.includes("month")){ const badM = out.filter(r => !/^\d{4}-\d{2}$/.test(r.month)).length; if (badM) errs.push(t("tBadMonth", { s:sc.sheet, n:badM })); }
  return { rows:out, errs };
}
async function handleFile(file, forcedTarget){
  const log = $("#importLog"); log.hidden = false; log.textContent = t("tReading", { f:file.name });
  if (!window.XLSX){ log.textContent = t("tNoXlsx"); toast(t("tNoXlsx")); return; }
  try {
    const buf = await file.arrayBuffer(), wb = XLSX.read(buf, { type:"array", cellDates:true }), target = forcedTarget || $("#importTarget").value, msgs = [], plan = [];
    if (target === "auto"){
      for (const [key, sc] of Object.entries(SCHEMA)){ const name = wb.SheetNames.find(s => s.trim().toLowerCase() === sc.sheet.toLowerCase()); if (name) plan.push([key, name]); }
      if (!plan.length){
        const best = name => { const hdr = (XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1 })[0] || []).map(h => String(h).trim().toLowerCase().replace(/[\s\-]+/g, "_"));
          return Object.entries(SCHEMA).filter(([, sc]) => sc.cols.every(c => hdr.includes(c))).sort((x, y) => y[1].cols.length - x[1].cols.length).map(([k]) => k)[0]; };
        wb.SheetNames.forEach(name => { const k = best(name); if (k && !plan.some(p => p[0] === k)) plan.push([k, name]); });
      }
      if (!plan.length){ log.textContent = t("tNoMatch", { s:Object.values(SCHEMA).map(s => s.sheet).join(", ") }); toast(t("toastNone")); show("data"); return; }
    } else plan.push([target, wb.SheetNames[0]]);
    let changed = 0;
    for (const [key, name] of plan){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:"", raw:true });
      const { rows:out, errs } = normalize(key, rows); msgs.push(...errs);
      if (out.length){ S.data[key] = out; changed++; msgs.unshift(t("tLoaded", { s:SCHEMA[key].sheet, n:out.length })); }
    }
    if (changed){ S.demo = false; if (S.settings.hospital === DEFAULT_SETTINGS.hospital) S.settings.hospital = ""; save(); renderAll(); }
    log.textContent = msgs.join("\n");
    toast(changed ? t("toastLoaded", { n:changed, f:file.name }) : t("toastNone"));
    if (!changed) show("data");
  } catch(e){ log.textContent = t("tReadErr", { e:e.message }); toast(t("toastReadErr")); }
}
async function download(blankOnly){
  if (!window.XLSX){ toast(t("toastNoXlsx")); return; }
  const wb = XLSX.utils.book_new();
  const readme = [[I18N.ar.readmeTitle], [I18N.en.readmeTitle], [""], [I18N.ar.readme1], [I18N.en.readme1], [I18N.ar.readme2], [I18N.en.readme2], [""],
    ["Sheet / الورقة", "Columns / الأعمدة", "الشرح", "Description"]]
    .concat(Object.entries(SCHEMA).map(([k, s]) => [s.sheet, s.cols.join(", "), I18N.ar["desc_" + k], I18N.en["desc_" + k]]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(readme), "README");
  for (const [key, sc] of Object.entries(SCHEMA)){
    const rows = blankOnly ? [] : S.data[key].map(r => { const o = {}; sc.cols.forEach(c => o[c] = r[c]); return o; });
    XLSX.utils.book_append_sheet(wb, rows.length ? XLSX.utils.json_to_sheet(rows, { header:sc.cols }) : XLSX.utils.aoa_to_sheet([sc.cols]), sc.sheet);
  }
  const buf = XLSX.write(wb, { bookType:"xlsx", type:"array" }), fname = blankOnly ? t("fileBlank") : t("fileFull");
  if (!downloadsApi){
    try { const url = URL.createObjectURL(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast(t("toastDl")); }
    catch(e){ toast(t("toastDlErr")); }
    return;
  }
  try { await downloadsApi.save({ filename:fname, data:buf }); toast(t("toastSaved")); }
  catch(e){ if (e && e.code !== "declined") toast(t("toastDlErr")); }
}
function renderData(){
  $("#schemaTable").innerHTML = `<thead><tr><th>${t("thSheet")}</th><th class="n">${t("thRowsNow")}</th><th>${t("thColumns")}</th><th>${t("thHolds")}</th></tr></thead><tbody>` +
    Object.entries(SCHEMA).map(([k, s]) => `<tr><td><b><bdi>${s.sheet}</bdi></b></td><td class="n">${fmt(S.data[k].length)}</td><td class="wrap"><code>${s.cols.join(", ")}</code></td><td class="wrap">${esc(t("desc_" + k))}</td></tr>`).join("") + "</tbody>";
  const st = S.settings; ["hospital","currency","utilLow","utilHigh","noShow","conv","decline","concentration","roas"].forEach(k => { $("#s-" + k).value = st[k]; });
}

/* ================= wiring ================= */
const RENDER = { overview:renderOverview, problems:renderProblems, audience:renderAudience, campaigns:renderCampaigns, plan:renderPlan, advisor:() => {}, data:renderData };
let active = "overview";
function show(tab){
  if (!RENDER[tab]) tab = "overview";
  active = tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + tab));
  try { RENDER[tab](); } catch(e){ console.error(e); }
  if (location.hash.slice(1) !== tab) history.replaceState(null, "", tab === "overview" ? location.pathname + location.search : "#" + tab);
}
function renderAll(){ renderHeader(); show(active); }
function setLang(l){
  if (l === LANG) return; LANG = l;
  try { localStorage.setItem("hmc_lang", l); } catch(e){}
  applyStatic(); renderAll();
}

document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g){ show(g.dataset.goto); window.scrollTo(0, 0); return; }
  const add = e.target.closest("[data-add]");
  if (add){ const i = diagnose().find(x => x.id === add.dataset.add); if (!i) return; const title = i.actions[+add.dataset.k];
    if (S.actions.some(a => a.title === title && a.dept === i.dept)){ toast(t("toastInPlan")); return; }
    S.actions.push({ id:uid(), title, dept:i.dept, owner:"", due:"", status:"todo", why:i.title }); save(); renderHeader(); add.textContent = t("added"); add.disabled = true; toast(t("toastAdded")); return; }
  const dc = e.target.closest("[data-delcamp]"); if (dc){ S.data.campaigns = S.data.campaigns.filter(c => c.id !== dc.dataset.delcamp); save(); renderAll(); return; }
  const da = e.target.closest("[data-delact]"); if (da){ S.actions = S.actions.filter(a => a.id !== da.dataset.delact); save(); renderPlan(); return; }
});
document.addEventListener("change", e => { const s = e.target.closest("[data-status]"); if (s){ const a = S.actions.find(x => x.id === s.dataset.status); if (a){ a.status = s.value; save(); renderPlan(); } } });
$("#periodSel").addEventListener("change", e => { S.settings.period = +e.target.value; save(); renderAll(); });
$("#sevFilter").addEventListener("change", renderProblems);
$("#segDim").addEventListener("change", renderAudience);
$("#segDept").addEventListener("change", renderAudience);
$("#campForm").addEventListener("submit", e => { e.preventDefault();
  const v = id => $("#cf-" + id).value;
  S.data.campaigns.push({ id:uid(), name:v("name").trim(), channel:v("channel").trim(), department:v("dept"), month:normMonth(v("month")), spend:+v("spend"), leads:+v("leads"), bookings:+v("bookings"), revenue:+v("revenue") });
  save(); e.target.reset(); renderAll(); toast(t("toastCamp")); });
$("#planForm").addEventListener("submit", e => { e.preventDefault();
  S.actions.push({ id:uid(), title:$("#pf-title").value.trim(), dept:$("#pf-dept").value, owner:$("#pf-owner").value.trim(), due:$("#pf-due").value, status:"todo" });
  save(); e.target.reset(); renderPlan(); toast(t("toastAct")); });
$("#setForm").addEventListener("submit", e => { e.preventDefault();
  ["utilLow","utilHigh","noShow","conv","decline","concentration","roas"].forEach(k => { const v = parseFloat($("#s-" + k).value); if (isFinite(v)) S.settings[k] = v; });
  S.settings.hospital = $("#s-hospital").value.trim(); S.settings.currency = $("#s-currency").value.trim() || "SAR";
  save(); renderAll(); toast(t("toastSet")); });
$("#fileIn").addEventListener("change", e => { const f = e.target.files[0]; if (f) handleFile(f); e.target.value = ""; });
const quick = $("#quickFile"), dz = $("#dropZone");
$("#hdrUpload").addEventListener("click", () => quick.click());
dz.addEventListener("click", () => quick.click());
dz.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); quick.click(); } });
quick.addEventListener("change", e => { const f = e.target.files[0]; if (f) handleFile(f, "auto").then(() => { quick.value = ""; }); });
["dragenter","dragover"].forEach(x => dz.addEventListener(x, e => { e.preventDefault(); dz.classList.add("over"); }));
["dragleave","drop"].forEach(x => dz.addEventListener(x, e => { e.preventDefault(); dz.classList.remove("over"); }));
dz.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) handleFile(f, "auto"); });
$("#obTemplate").addEventListener("click", () => download(false));
$("#dlTemplate").addEventListener("click", () => download(false));
$("#dlBlank").addEventListener("click", () => download(true));
let resetArmed = false;
$("#resetDemo").addEventListener("click", e => {
  if (!resetArmed){ resetArmed = true; e.target.textContent = t("resetConfirm"); setTimeout(() => { resetArmed = false; e.target.textContent = t("resetDemo"); }, 4000); return; }
  resetArmed = false; e.target.textContent = t("resetDemo");
  S = { settings:{ ...DEFAULT_SETTINGS }, data:genDemo(), actions:S.actions, demo:true }; save(); renderAll(); toast(t("toastReset")); });
$("#presets").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c){ $("#askBox").value = c.textContent; ask(c.textContent); } });
$("#askBtn").addEventListener("click", () => ask($("#askBox").value));
$("#stopBtn").addEventListener("click", () => abortCtl && abortCtl.abort());
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "overview"));
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
if (mq && mq.addEventListener) mq.addEventListener("change", () => show(active));
new MutationObserver(() => show(active)).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });

applyStatic();
renderHeader();
show(location.hash.slice(1) || "overview");

/* offline / install support (works on GitHub Pages; skipped inside Claude) */
if ("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
/* capabilities: light up when available (only inside Claude) */
(async () => {
  $("#advisorOn").hidden = true; $("#advisorOff").hidden = false;
  try {
    if (window.claude && typeof claude.use === "function"){
      const [smp, dl] = await Promise.all([claude.use("sample").catch(() => null), claude.use("downloads").catch(() => null)]);
      sampleFn = smp; downloadsApi = dl;
    }
  } catch(e){}
  if (sampleFn){ $("#advisorOn").hidden = false; $("#advisorOff").hidden = true; }
})();
</script>
